name: Test, build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: python -m unittest discover -v
      - name: Build and validate
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify installed wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          python -I -c "from libyazio import YazioClient, AsyncYazioClient, YazioError; from importlib.metadata import version; assert version('libyazio')"
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish private release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO" --jq .private)" = true
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump the package version for a new release."
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
